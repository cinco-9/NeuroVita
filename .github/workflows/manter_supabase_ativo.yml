# O Supabase grátis pausa o projeto depois de cerca de 7 dias sem uso. Este workflow faz uma consulta
# simples ao banco a cada 3 dias para ele continuar ativo. Com a chave anon e o RLS, a resposta é uma
# lista vazia: nenhum dado de usuário é lido.
# Precisa dos secrets SUPABASE_URL e SUPABASE_KEY (Settings > Secrets and variables > Actions).
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *"   # 12:00 UTC (9:00 em Brasília), a cada 3 dias
  workflow_dispatch:          # permite rodar na mão pela aba Actions

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Valores colados na caixa do GitHub podem vir com espaço ou quebra de linha no fim
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          url=${url%/}
          chave=$(printf '%s' "$SUPABASE_KEY" | tr -d '[:space:]')
          if [ -z "$url" ] || [ -z "$chave" ]; then
            echo "Faltam os secrets SUPABASE_URL e SUPABASE_KEY"; exit 1
          fi
          case "$url" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL deveria ter o formato https://<projeto>.supabase.co (tamanho lido: ${#url})"; exit 1 ;;
          esac
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$url/rest/v1/compartilhamentos?select=id&limit=1" \
            -H "apikey: $chave" -H "Authorization: Bearer $chave")
          echo "Resposta do Supabase: $status"
          [ "$status" = "200" ]
