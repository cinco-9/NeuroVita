[theme]
base = "dark"
primaryColor = "#4fb9c4"
backgroundColor = "#1D2125"
secondaryBackgroundColor = "#22272B"
textColor = "#B6C2CF"
borderColor = "#38414A"
showWidgetBorder = true
baseRadius = "6px"
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"

[theme.sidebar]
backgroundColor = "#161A1D"
secondaryBackgroundColor = "#1D2125"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
